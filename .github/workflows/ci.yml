name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pytest pyflakes
      - run: python -m compileall -q ros2/medusa_auv/medusa_auv connect.py export_sightings.py src/detection/train.py
      - run: python -m pyflakes ros2/medusa_auv/medusa_auv connect.py export_sightings.py
      - run: pytest ros2/medusa_auv/test -q
