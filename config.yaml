fathomnet_positive_concepts:
  - Scyphozoa
  - Aurelia aurita
  - Chrysaora
  - Rhizostoma pulmo
  - Pelagia noctiluca
  - Cyanea capillata

fathomnet_negative_concepts:
  - Sebastes
  - Octopus
  - Strongylocentrotus
  - Porifera
  - Asteroidea
  - Crustacea

max_samples: 500
img_size: 224
batch_size: 32
epochs: 40
fine_tune_epochs: 20
threshold: 0.7
dropout1: 0.5
dropout2: 0.3

model_path: models/jellyfish_model.tflite
inference_threshold: 0.7
smoothing_window: 12
inference_stride: 2
inference_stride_search: 4

pulse_window_frames: 64
pulse_band_min_hz: 0.25
pulse_band_max_hz: 1.0

fusion_model_weight: 0.7
dataset_capture: false
dataset_min_confidence: 0.8
dataset_dir: data/dataset

lure_gpio_pin: 24
lure_modes: [3]

camera_source: 0
camera_fps: 20

bell_gpio_pin: 12
bell_pca_channel: 0
pwm_frequency: 50
bell_neutral_deg: 45
bell_amplitude_deg: 45
bell_pulse_init_hz: 0.5
bell_pulse_min_hz: 0.25
bell_pulse_max_hz: 1.0
control_rate_hz: 50
actuator_idle_w: 0.5
actuator_stroke_j: 0.4

tuner_step_hz: 0.05
tuner_interval_s: 4.0
imu_update_hz: 50.0
body_length_m: 0.21
vehicle_mass_kg: 0.512
imu_speed_gain: 0.1
sim_natural_hz: 0.6
sim_bandwidth_hz: 0.2

observe_threshold: 0.9
behavior_patience: 20

relay_enabled: true
dive_duration_s: 120.0
surface_duration_s: 20.0
surface_pulse_hz: 1.0

battery_full_v: 8.4
battery_low_v: 6.6
battery_empty_v: 6.0
battery_check_interval_s: 2.0
sim_battery_minutes: 10.0

operating_depth_max_m: 5.0
search_depth_m: 1.5
ascent_rate_mps: 0.1
descent_rate_mps: 0.05
depth_update_hz: 5.0

map_cell_deg: 0.0001
map_output_path: data/bloom_map.geojson
map_save_interval_s: 10.0
bloom_low_count: 3
bloom_high_count: 10

vr_bridge_host: "0.0.0.0"
vr_bridge_port: 8765
vr_bridge_rate_hz: 10.0
vr_https_port: 8443
record_dir: data/sessions

teleop_forward_threshold: 0.3
teleop_back_threshold: -0.3
teleop_timeout_s: 2.0

home_lat: 47.36
home_lon: 8.54
gps_wander_deg: 0.0002
gps_update_hz: 1.0

water_temp_c: 24.0
water_temp_swing_c: 3.0
day_cycle_s: 600.0
environment_update_hz: 1.0

optimal_temp_min_c: 25.0
optimal_temp_max_c: 27.0
temp_falloff_c: 5.0
density_reference: 10.0
forecast_update_hz: 1.0

leak_gpio_pin: 23
leak_check_interval_s: 1.0

waypoints:
  - [47.360, 8.540]
  - [47.361, 8.541]
  - [47.359, 8.542]
waypoint_arrival_m: 3.0
mission_update_hz: 1.0

sightings_output_path: data/sightings_gbif.csv
